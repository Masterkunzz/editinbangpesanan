<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin EditinBang</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        .login-box h2 { margin-bottom: 25px; color: #111827; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h2, h3 { color: #111827; margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #4b5563; }
        .form-group input, .form-group textarea, .form-group select {
            padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 14px; font-family: inherit; outline: none; transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #4f46e5; }
        button {
            padding: 12px 24px; background-color: #4f46e5; color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: background 0.2s;
        }
        button:hover { background-color: #4338ca; }
        .btn-wa {
            background-color: #25d366; padding: 6px 12px; font-size: 12px;
            color: white; border-radius: 6px; text-decoration: none;
            font-weight: 600; display: inline-block; border: none; cursor: pointer;
        }
        .btn-wa:hover { background-color: #1ebd59; }
        .btn-danger {
            background-color: #ef4444; padding: 6px 12px; font-size: 12px;
            color: white; border-radius: 6px; font-weight: 600; border: none; cursor: pointer;
        }
        .btn-danger:hover { background-color: #dc2626; }
        .admin-content { display: none; }
        .table-responsive { overflow-x: auto; margin-top: 25px; }
        .order-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .order-table th, .order-table td { padding: 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .order-table th { background-color: #f9fafb; font-weight: 600; color: #374151; }
        .badge-status {
            padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 12px;
        }
        .badge-menerima { background:#dbeafe; color:#1d4ed8; }
        .badge-editing  { background:#fef9c3; color:#92400e; }
        .badge-finishing{ background:#fce7f3; color:#9d174d; }
        .badge-selesai  { background:#d1fae5; color:#065f46; }
        .progress-mini {
            background: #e5e7eb; border-radius: 20px; height: 6px; width: 80px; margin-top: 4px;
        }
        .progress-mini-bar { background: #6366f1; height: 100%; border-radius: 20px; transition: width 0.4s; }
        hr { border: 0; border-top: 1px solid #e5e7eb; margin: 35px 0; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input {
            padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;
            font-family: inherit; font-size: 14px; outline: none;
        }
        .filter-bar select:focus, .filter-bar input:focus { border-color: #4f46e5; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginBox" class="login-box">
    <h2>Login Admin</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="prosesLogin()" style="width: 100%; margin-top: 10px;">Masuk Panel</button>
    <p id="login-err" style="color:#ef4444;font-size:13px;margin-top:10px;display:none;">Username / Password salah!</p>
</div>

<!-- Admin Panel -->
<div id="adminContent" class="container admin-content">
    <h2>Panel Kontrol Pesanan EditinBang</h2>
    <hr>

    <!-- Form Pesanan Baru -->
    <h3>Buat Pesanan Baru</h3>
    <form id="formPesanan" onsubmit="simpanPesanan(event)">
        <div class="form-grid">
            <div class="form-group">
                <label>Nomor Pesanan</label>
                <input type="text" id="noPesanan" placeholder="Misal: EDITINBANG-1284" required>
            </div>
            <div class="form-group">
                <label>Nama Pemesan / Klien</label>
                <input type="text" id="namaPemesan" placeholder="Misal: WargaWA-1321" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp Klien</label>
                <input type="text" id="nomorWA" placeholder="08123456789 atau 628123..." required>
            </div>
            <div class="form-group">
                <label>Jenis Produk</label>
                <input type="text" id="jenisProduk" placeholder="Misal: Video Minecraft / Shorts" required>
            </div>
            <div class="form-group">
                <label>Harga Normal (opsional, diisi jika ada diskon)</label>
                <input type="number" id="hargaNormal" placeholder="Misal: 100000">
            </div>
            <div class="form-group">
                <label>Harga Fix / Diskon (Rp)</label>
                <input type="number" id="hargaDiskon" placeholder="Misal: 75000" required>
            </div>
            <div class="form-group">
                <label>Deadline Pekerjaan</label>
                <input type="date" id="deadline" required>
            </div>
            <!-- ✅ DROPDOWN EDITOR (mudah ditambah/edit di sini) -->
            <div class="form-group">
                <label>Assign Editor</label>
                <select id="editor" required>
                    <option value="" disabled selected>— Pilih Editor —</option>
                    <option value="Ahmad">Ahmad (CEO)</option>
                    <option value="Villa">Villa</option>
                    <option value="Fauzan">Fauzan</option>
                    <option value="Neo">Neo</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label>Link Brief <span style="color:#ef4444">*</span></label>
                <input type="url" id="linkBrief" placeholder="https://drive.google.com/... atau link brief lainnya" required>
            </div>
            <div class="form-group full-width">
                <label>Catatan Tambahan</label>
                <textarea id="note" rows="3" placeholder="Instruksi khusus editing jika ada..."></textarea>
            </div>
        </div>
        <button type="submit" style="margin-top: 10px;">
            <span id="submit-text">💾 Simpan & Kirim WA</span>
        </button>
    </form>

    <hr>

    <!-- Daftar Pesanan -->
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <h3 style="margin:0">Daftar & Kontrol Progress Pesanan</h3>
        <span id="total-badge" style="background:#ede9fe;color:#5b21b6;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;"></span>
    </div>

    <!-- Filter -->
    <div class="filter-bar" style="margin-top:16px;">
        <select id="filter-editor" onchange="renderTable()">
            <option value="">Semua Editor</option>
            <option value="Ahmad">Ahmad</option>
            <option value="Villa">Villa</option>
            <option value="Fauzan">Fauzan</option>
            <option value="Neo">Neo</option>
        </select>
        <select id="filter-status" onchange="renderTable()">
            <option value="">Semua Status</option>
            <option value="editor sudah menerima project">Menerima Project</option>
            <option value="proses editing">Proses Editing</option>
            <option value="finishing">Finishing</option>
            <option value="selesai">Selesai</option>
        </select>
        <input type="text" id="filter-search" oninput="renderTable()" placeholder="Cari nama / nomor...">
    </div>

    <div class="table-responsive">
        <table class="order-table">
            <thead>
                <tr>
                    <th>No Pesanan</th>
                    <th>Nama Klien</th>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Deadline</th>
                    <th>Brief</th>
                    <th>Editor</th>
                    <th>Status & Progres</th>
                    <th>Ubah Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelPesananBody">
                <tr><td colspan='10' style='text-align:center;'>Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5KIQvwLtVpSCZo9eIFbvMVAxLuKvI-y0",
        authDomain: "editintrack.firebaseapp.com",
        databaseURL: "https://editintrack-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "editintrack",
        storageBucket: "editintrack.firebasestorage.app",
        messagingSenderId: "141841901436",
        appId: "1:141841901436:web:752078e47fb168b03be6f9"
    };

    const app      = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    // Semua data pesanan disimpan di sini untuk filter client-side
    let allPesanan = [];

    // ================================================================
    // Login
    // ================================================================
    window.prosesLogin = function() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (u === "Admin" && p === "Ahmad") {
            document.getElementById('loginBox').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            muatDaftarPesanan();
        } else {
            document.getElementById('login-err').style.display = "block";
        }
    };

    // ================================================================
    // Helpers
    // ================================================================
    function formatKe62(nomor) {
        let n = nomor.replace(/[^0-9]/g, '');
        return n.startsWith('0') ? '62' + n.slice(1) : n;
    }

    function formatTanggal(dateStr) {
        if (!dateStr) return '-';
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    }

    function badgeClass(status) {
        if (status === 'editor sudah menerima project') return 'badge-menerima';
        if (status === 'proses editing') return 'badge-editing';
        if (status === 'finishing') return 'badge-finishing';
        if (status === 'selesai') return 'badge-selesai';
        return 'badge-menerima';
    }

    function labelStatus(status) {
        const map = {
            'editor sudah menerima project': 'Menerima Project',
            'proses editing': 'Proses Editing',
            'finishing': 'Finishing',
            'selesai': 'Selesai'
        };
        return map[status] || status;
    }

    // ================================================================
    // Simpan Pesanan
    // ================================================================
    window.simpanPesanan = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-text');
        btn.textContent = '⏳ Menyimpan...';

        const noPesanan   = document.getElementById('noPesanan').value.trim();
        const waBersih    = formatKe62(document.getElementById('nomorWA').value.trim());
        const hargaNormal = document.getElementById('hargaNormal').value;
        const hargaDiskon = document.getElementById('hargaDiskon').value;

        const dataPesanan = {
            nomor_pesanan : noPesanan,
            nama_pemesan  : document.getElementById('namaPemesan').value,
            nomor_wa      : waBersih,
            jenis_produk  : document.getElementById('jenisProduk').value,
            harga_normal  : hargaNormal || "",
            harga_diskon  : hargaDiskon,
            deadline      : document.getElementById('deadline').value,
            editor        : document.getElementById('editor').value,
            link_brief    : document.getElementById('linkBrief').value,
            note          : document.getElementById('note').value,
            status        : "editor sudah menerima project",
            progres       : 10,
            created_at    : Date.now()
        };

        set(ref(database, 'pesanan/' + noPesanan), dataPesanan)
            .then(() => {
                bukaLinkWhatsApp(dataPesanan);
                document.getElementById('formPesanan').reset();
                btn.textContent = '💾 Simpan & Kirim WA';
            })
            .catch(err => {
                alert("Gagal menyimpan: " + err.message);
                btn.textContent = '💾 Simpan & Kirim WA';
            });
    };

    // ================================================================
    // WhatsApp
    // ================================================================
    function bukaLinkWhatsApp(data) {
        let hargaTeks;
        if (data.harga_normal) {
            hargaTeks = `~${parseInt(data.harga_normal).toLocaleString('id-ID')}~ ${parseInt(data.harga_diskon).toLocaleString('id-ID')}`;
        } else {
            hargaTeks = parseInt(data.harga_diskon).toLocaleString('id-ID');
        }

        const pesan = `PESANAN DIPROSES ⌛

Nomor Pesanan : ${data.nomor_pesanan}
Pelanggan : ${data.nama_pemesan}
Harga : ${hargaTeks}
Deadline : ${formatTanggal(data.deadline)}
Editor : ${data.editor}

note
* deadline yang berlaku hanya patokan maksimal, tidak menutup kemungkinan lebih cepat

track pesanan real-time : statuspesanan.editinbang.my.id
kritik dan saran : kritiksaran.editinbang.my.id`;

        window.open(`https://api.whatsapp.com/send?phone=${data.nomor_wa}&text=${encodeURIComponent(pesan)}`, '_blank');
    }

    window.kirimUlangWA = function(noPesanan) {
        get(ref(database, 'pesanan/' + noPesanan)).then(snap => {
            if (snap.exists()) bukaLinkWhatsApp(snap.val());
        });
    };

    // ================================================================
    // Update Status
    // ================================================================
    window.ubahStatus = function(noPesanan, statusBaru) {
        const progresMap = {
            'editor sudah menerima project': 10,
            'proses editing': 40,
            'finishing': 80,
            'selesai': 100
        };
        update(ref(database, 'pesanan/' + noPesanan), {
            status: statusBaru,
            progres: progresMap[statusBaru]
        });
    };

    // ================================================================
    // Hapus Pesanan
    // ================================================================
    window.hapusPesanan = function(noPesanan) {
        if (!confirm(`Yakin hapus pesanan ${noPesanan}?`)) return;
        remove(ref(database, 'pesanan/' + noPesanan));
    };

    // ================================================================
    // Muat & Render
    // ================================================================
    function muatDaftarPesanan() {
        onValue(ref(database, 'pesanan'), (snapshot) => {
            allPesanan = [];
            console.log('Snapshot exists:', snapshot.exists(), '| Jumlah child:', snapshot.size);
            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    console.log('Data masuk:', child.key, child.val());
                    allPesanan.push(child.val());
                });
            }
            console.log('Total allPesanan:', allPesanan.length);
            renderTable();
        });
    }

    window.renderTable = function() {
        const tbody       = document.getElementById('tabelPesananBody');
        const fEditor     = document.getElementById('filter-editor').value;
        const fStatus     = document.getElementById('filter-status').value;
        const fSearch     = document.getElementById('filter-search').value.toLowerCase();
        const totalBadge  = document.getElementById('total-badge');

        let filtered = allPesanan.filter(d => {
            const matchEditor = !fEditor || d.editor === fEditor;
            const matchStatus = !fStatus || d.status === fStatus;
            const matchSearch = !fSearch
                || (d.nomor_pesanan && d.nomor_pesanan.toLowerCase().includes(fSearch))
                || (d.nama_pemesan && d.nama_pemesan.toLowerCase().includes(fSearch));
            return matchEditor && matchStatus && matchSearch;
        });

        // Sort: selesai paling bawah, sisanya deadline terdekat paling atas
        filtered.sort((a, b) => {
            const aSelesai = a.status === 'selesai';
            const bSelesai = b.status === 'selesai';
            if (aSelesai && !bSelesai) return 1;
            if (!aSelesai && bSelesai) return -1;
            return new Date(a.deadline) - new Date(b.deadline);
        });

        totalBadge.textContent = `${filtered.length} pesanan`;
        tbody.innerHTML = '';

        if (filtered.length === 0) {
            tbody.innerHTML = "<tr><td colspan='10' style='text-align:center;color:#9ca3af;padding:30px;'>Tidak ada pesanan ditemukan.</td></tr>";
            return;
        }

        filtered.forEach(data => {
            let hargaHTML;
            if (data.harga_normal) {
                hargaHTML = `<span style="text-decoration:line-through;color:#9ca3af;font-size:12px;">Rp ${parseInt(data.harga_normal).toLocaleString('id-ID')}</span><br><strong style="color:#065f46;">Rp ${parseInt(data.harga_diskon).toLocaleString('id-ID')}</strong>`;
            } else {
                hargaHTML = `<strong>Rp ${parseInt(data.harga_diskon || 0).toLocaleString('id-ID')}</strong>`;
            }

            const bc = badgeClass(data.status);
            const lb = labelStatus(data.status);
            const briefHTML = data.link_brief
                ? `<a href="${data.link_brief}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;background:#ede9fe;color:#5b21b6;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;">📎 Buka Brief</a>`
                : `<span style="color:#9ca3af;font-size:12px;">—</span>`;

            const tr = document.createElement('tr');
            if (data.status === 'selesai') tr.style.opacity = '0.6';

            tr.innerHTML = `
                    <td><strong style="font-family:monospace;color:#4f46e5;">${data.nomor_pesanan}</strong></td>
                    <td>${data.nama_pemesan}</td>
                    <td>${data.jenis_produk}</td>
                    <td style="font-size:13px;">${hargaHTML}</td>
                    <td>${formatTanggal(data.deadline)}</td>
                    <td>${briefHTML}</td>
                    <td><strong>${data.editor}</strong></td>
                    <td>
                        <span class="badge-status ${bc}">${lb} (${data.progres}%)</span>
                        <div class="progress-mini"><div class="progress-mini-bar" style="width:${data.progres}%"></div></div>
                    </td>
                    <td>
                        <select onchange="ubahStatus('${data.nomor_pesanan}', this.value)" style="padding:6px;border-radius:6px;font-family:inherit;font-size:13px;border:1px solid #d1d5db;">
                            <option value="editor sudah menerima project" ${data.status === 'editor sudah menerima project' ? 'selected' : ''}>1. Menerima (10%)</option>
                            <option value="proses editing" ${data.status === 'proses editing' ? 'selected' : ''}>2. Editing (40%)</option>
                            <option value="finishing" ${data.status === 'finishing' ? 'selected' : ''}>3. Finishing (80%)</option>
                            <option value="selesai" ${data.status === 'selesai' ? 'selected' : ''}>4. Selesai (100%)</option>
                        </select>
                    </td>
                    <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn-wa" onclick="kirimUlangWA('${data.nomor_pesanan}')">📲 WA</button>
                        <button class="btn-danger" onclick="hapusPesanan('${data.nomor_pesanan}')">🗑️</button>
                    </td>`;
            tbody.appendChild(tr);
        });
    };
</script>

</body>
</html>
