<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin EditinBang</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 25px;
            color: #111827;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h2, h3 {
            color: #111827;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        .form-group label {
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #4b5563;
        }
        .form-group input, .form-group textarea, .form-group select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #4f46e5;
        }
        button {
            padding: 12px 24px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        .btn-wa {
            background-color: #25d366;
            padding: 6px 12px;
            font-size: 12px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
        }
        .btn-wa:hover {
            background-color: #1ebd59;
        }
        .admin-content {
            display: none;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 25px;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .order-table th, .order-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .order-table th {
            background-color: #f9fafb;
            font-weight: 600;
            color: #374151;
        }
        .badge-status {
            padding: 4px 8px;
            background-color: #e0e7ff;
            color: #4338ca;
            border-radius: 6px;
            font-weight: 500;
            font-size: 12px;
        }
        hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 35px 0;
        }
    </style>
</head>
<body>

<div id="loginBox" class="login-box">
    <h2>Login Admin</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="prosesLogin()" style="width: 100%; margin-top: 10px;">Masuk Panel</button>
</div>

<div id="adminContent" class="container admin-content">
    <h2>Panel Kontrol Pesanan EditinBang</h2>
    <hr>
    
    <h3>Buat Pesanan Baru</h3>
    <form id="formPesanan" onsubmit="simpanPesanan(event)">
        <div class="form-grid">
            <div class="form-group">
                <label>Nomor Pesanan</label>
                <input type="text" id="noPesanan" placeholder="Misal: EDITINBANG-1284" required>
            </div>
            <div class="form-group">
                <label>Nama Pemesan / Klien</label>
                <input type="text" id="namaPemesan" placeholder="Misal: WargaWA-1321" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp Klien</label>
                <input type="text" id="nomorWA" placeholder="Misal: 08123456789 atau 628123456789" required>
            </div>
            <div class="form-group">
                <label>Jenis Produk</label>
                <input type="text" id="jenisProduk" placeholder="Misal: Video Minecraft / Shorts" required>
            </div>
            <div class="form-group">
                <label>Harga Normal (Opsional - Diisi jika ada diskon)</label>
                <input type="number" id="hargaNormal" placeholder="Misal: 100000">
            </div>
            <div class="form-group">
                <label>Harga Diskon / Harga Fix (Rp)</label>
                <input type="number" id="hargaDiskon" placeholder="Misal: 75000" required>
            </div>
            <div class="form-group">
                <label>Deadline Pekerjaan</label>
                <input type="text" id="deadline" placeholder="Misal: 2 hari / 15 Juni 2026" required>
            </div>
            <div class="form-group">
                <label>Editor</label>
                <input type="text" id="editor" required>
            </div>
            <div class="form-group full-width">
                <label>Catatan Tambahan</label>
                <textarea id="note" rows="3" placeholder="Tambahkan instruksi khusus editing jika ada..."></textarea>
            </div>
        </div>
        <button type="submit" style="margin-top: 10px;">Tambah & Kirim WA</button>
    </form>

    <hr>
    
    <h3>Daftar & Kontrol Progress Pesanan</h3>
    <div class="table-responsive">
        <table class="order-table">
            <thead>
                <tr>
                    <th>No Pesanan</th>
                    <th>Nama Klien</th>
                    <th>Produk</th>
                    <th>Editor</th>
                    <th>Status Saat Ini</th>
                    <th>Ubah Kontrol Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelPesananBody">
                <tr><td colspan='7' style='text-align:center;'>Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5KIQvwLtVpSCZo9eIFbvMVAxLuKvI-y0",
        authDomain: "editintrack.firebaseapp.com",
        databaseURL: "https://editintrack-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "editintrack",
        storageBucket: "editintrack.firebasestorage.app",
        messagingSenderId: "141841901436",
        appId: "1:141841901436:web:752078e47fb168b03be6f9"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    window.prosesLogin = function() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === "Admin" && pass === "Ahmad") {
            document.getElementById('loginBox').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            muatDaftarPesanan();
        } else {
            alert("Username atau Password salah!");
        }
    }

    // Fungsi pembantu untuk konversi nomor HP berawalan 0 ke format internasional 62
    function formatKe62(nomor) {
        let cleanNumber = nomor.replace(/[^0-9]/g, '');
        if (cleanNumber.startsWith('0')) {
            cleanNumber = '62' + cleanNumber.slice(1);
        }
        return cleanNumber;
    }

    window.simpanPesanan = function(e) {
        e.preventDefault();
        
        const noPesanan = document.getElementById('noPesanan').value.trim();
        const waInput = document.getElementById('nomorWA').value.trim();
        const waBersih = formatKe62(waInput);

        const hargaNormalVal = document.getElementById('hargaNormal').value;
        const hargaDiskonVal = document.getElementById('hargaDiskon').value;
        
        const dataPesanan = {
            nomor_pesanan: noPesanan,
            nama_pemesan: document.getElementById('namaPemesan').value,
            nomor_wa: waBersih,
            jenis_produk: document.getElementById('jenisProduk').value,
            harga_normal: hargaNormalVal || "",
            harga_diskon: hargaDiskonVal,
            deadline: document.getElementById('deadline').value,
            editor: document.getElementById('editor').value,
            note: document.getElementById('note').value,
            status: "editor sudah menerima project",
            progres: 10
        };

        set(ref(database, 'pesanan/' + noPesanan), dataPesanan)
        .then(() => {
            alert("Pesanan " + noPesanan + " berhasil ditambahkan!");
            
            // Picu fungsi kirim pesan WA otomatis setelah input sukses
            bukaLinkWhatsApp(dataPesanan);
            
            document.getElementById('formPesanan').reset();
        })
        .catch((error) => {
            alert("Gagal menyimpan data: " + error.message);
        });
    }

    // Fungsi menyusun teks template nota dan membuka tab baru WhatsApp
    function bukaLinkWhatsApp(data) {
        let hargaTeks = "";
        
        // Logika mencoret harga normal jika diinput oleh admin
        if (data.harga_normal) {
            let hNormal = parseInt(data.harga_normal).toLocaleString('id-ID');
            let hDiskon = parseInt(data.harga_diskon).toLocaleString('id-ID');
            hargaTeks = `~${hNormal}~ ${hDiskon}`;
        } else {
            hargaTeks = parseInt(data.harga_diskon).toLocaleString('id-ID');
        }

        const templatePesan = `PESANAN DIPROSES ⌛

Nomor Pesanan : ${data.nomor_pesanan}
Pelanggan : ${data.nama_pemesan}
Harga : ${hargaTeks}
Deadline : ${data.deadline}
Editor : ${data.editor}

note
* deadline yang berlaku hanya patokan maksimal, tidak menutup kemungkinan lebih cepat

track pesanan real-time : statuspesanan.editinbang.my.id
kritik dan saran : kritiksaran.editinbang.my.id`;

        const URLWA = `https://api.whatsapp.com/send?phone=${data.nomor_wa}&text=${encodeURIComponent(templatePesan)}`;
        window.open(URLWA, '_blank');
    }

    // Fungsi manual kirim ulang WA jika dipicu melalui tombol tabel daftar pesanan
    window.kirimUlangWA = function(noPesanan) {
        get(ref(database, 'pesanan/' + noPesanan)).then((snapshot) => {
            if (snapshot.exists()) {
                bukaLinkWhatsApp(snapshot.val());
            }
        });
    }

    window.ubahStatus = function(noPesanan, statusBaru) {
        let progresBaru = 10;

        if (statusBaru === "editor sudah menerima project") progresBaru = 10;
        else if (statusBaru === "proses editing") progresBaru = 40;
        else if (statusBaru === "finishing") progresBaru = 80;
        else if (statusBaru === "selesai") progresBaru = 100;

        update(ref(database, 'pesanan/' + noPesanan), {
            status: statusBaru,
            progres: progresBaru
        });
    }

    function muatDaftarPesanan() {
        const pesananAllRef = ref(database, 'pesanan');
        
        onValue(pesananAllRef, (snapshot) => {
            const tbody = document.getElementById('tabelPesananBody');
            tbody.innerHTML = "";
            
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    const selectHTML = `
                        <select onchange="ubahStatus('${data.nomor_pesanan}', this.value)" style="padding: 6px; border-radius: 6px; font-family: inherit;">
                            <option value="editor sudah menerima project" ${data.status === 'editor sudah menerima project' ? 'selected' : ''}>1. Menerima Project (10%)</option>
                            <option value="proses editing" ${data.status === 'proses editing' ? 'selected' : ''}>2. Proses Editing (40%)</option>
                            <option value="finishing" ${data.status === 'finishing' ? 'selected' : ''}>3. Finishing (80%)</option>
                            <option value="selesai" ${data.status === 'selesai' ? 'selected' : ''}>4. Selesai (100%)</option>
                        </select>
                    `;

                    const row = `
                        <tr>
                            <td><strong>${data.nomor_pesanan}</strong></td>
                            <td>${data.nama_pemesan}</td>
                            <td>${data.jenis_produk}</td>
                            <td>${data.editor}</td>
                            <td><span class="badge-status">${data.status} (${data.progres}%)</span></td>
                            <td>${selectHTML}</td>
                            <td>
                                <button onclick="kirimUlangWA('${data.nomor_pesanan}')" class="btn-wa">Kirim WA</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Belum ada data pesanan.</td></tr>";
            }
        });
    }
</script>

</body>
</html>
