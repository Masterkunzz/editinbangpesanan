<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin EditinBang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2, h3 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .admin-content {
            display: none;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        .order-table th, .order-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .order-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div id="loginBox" class="login-box">
    <h2>Login Admin EditinBang</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="prosesLogin()" style="width: 100%;">Login</button>
</div>

<div id="adminContent" class="container admin-content">
    <h2>Panel Kontrol Pesanan EditinBang</h2>
    <hr>
    
    <h3>Buat Pesanan Baru</h3>
    <form id="formPesanan" onsubmit="simpanPesanan(event)">
        <div class="form-group">
            <label>Nomor Pesanan</label>
            <input type="text" id="noPesanan" required>
        </div>
        <div class="form-group">
            <label>Nama Pemesan</label>
            <input type="text" id="namaPemesan" required>
        </div>
        <div class="form-group">
            <label>Jenis Produk</label>
            <input type="text" id="jenisProduk" placeholder="Misal: Video Minecraft / Shorts" required>
        </div>
        <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="harga" required>
        </div>
        <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="deadline" required>
        </div>
        <div class="form-group">
            <label>Editor</label>
            <input type="text" id="editor" required>
        </div>
        <div class="form-group">
            <label>Note / Catatan Tambahan</label>
            <textarea id="note" rows="3"></textarea>
        </div>
        <button type="submit">Tambah Pesanan</button>
    </form>

    <hr style="margin-top: 40px;">
    
    <h3>Daftar & Kontrol Progress Pesanan</h3>
    <table class="order-table">
        <thead>
            <tr>
                <th>No Pesanan</th>
                <th>Nama Klien</th>
                <th>Produk</th>
                <th>Editor</th>
                <th>Progress Saat Ini</th>
                <th>Ubah Kontrol Status</th>
            </tr>
        </thead>
        <tbody id="tabelPesananBody">
            <tr><td colspan='6' style='text-align:center;'>Memuat data...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5KIQvwLtVpSCZo9eIFbvMVAxLuKvI-y0",
        authDomain: "editintrack.firebaseapp.com",
        databaseURL: "https://editintrack-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "editintrack",
        storageBucket: "editintrack.firebasestorage.app",
        messagingSenderId: "141841901436",
        appId: "1:141841901436:web:752078e47fb168b03be6f9"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    window.prosesLogin = function() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === "Admin" && pass === "Ahmad") {
            document.getElementById('loginBox').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            muatDaftarPesanan();
        } else {
            alert("Username atau Password salah!");
        }
    }

    window.simpanPesanan = function(e) {
        e.preventDefault();
        
        const noPesanan = document.getElementById('noPesanan').value.trim();
        
        const dataPesanan = {
            nomor_pesanan: noPesanan,
            nama_pemesan: document.getElementById('namaPemesan').value,
            jenis_produk: document.getElementById('jenisProduk').value,
            harga: document.getElementById('harga').value,
            deadline: document.getElementById('deadline').value,
            editor: document.getElementById('editor').value,
            note: document.getElementById('note').value,
            status: "editor sudah menerima project",
            progres: 10
        };

        set(ref(database, 'pesanan/' + noPesanan), dataPesanan)
        .then(() => {
            alert("Pesanan " + noPesanan + " berhasil ditambahkan!");
            document.getElementById('formPesanan').reset();
        })
        .catch((error) => {
            alert("Gagal menyimpan data: " + error.message);
        });
    }

    window.ubahStatus = function(noPesanan, statusBaru) {
        let progresBaru = 10;

        if (statusBaru === "editor sudah menerima project") progresBaru = 10;
        else if (statusBaru === "proses editing") progresBaru = 40;
        else if (statusBaru === "finishing") progresBaru = 80;
        else if (statusBaru === "selesai") progresBaru = 100;

        update(ref(database, 'pesanan/' + noPesanan), {
            status: statusBaru,
            progres: progresBaru
        });
    }

    function muatDaftarPesanan() {
        const pesananAllRef = ref(database, 'pesanan');
        
        onValue(pesananAllRef, (snapshot) => {
            const tbody = document.getElementById('tabelPesananBody');
            tbody.innerHTML = "";
            
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    const selectHTML = `
                        <select onchange="ubahStatus('${data.nomor_pesanan}', this.value)">
                            <option value="editor sudah menerima project" ${data.status === 'editor sudah menerima project' ? 'selected' : ''}>1. Menerima Project (10%)</option>
                            <option value="proses editing" ${data.status === 'proses editing' ? 'selected' : ''}>2. Proses Editing (40%)</option>
                            <option value="finishing" ${data.status === 'finishing' ? 'selected' : ''}>3. Finishing (80%)</option>
                            <option value="selesai" ${data.status === 'selesai' ? 'selected' : ''}>4. Selesai (100%)</option>
                        </select>
                    `;

                    const row = `
                        <tr>
                            <td>${data.nomor_pesanan}</td>
                            <td>${data.nama_pemesan}</td>
                            <td>${data.jenis_produk}</td>
                            <td>${data.editor}</td>
                            <td><strong>${data.status} (${data.progres}%)</strong></td>
                            <td>${selectHTML}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Belum ada data pesanan.</td></tr>";
            }
        });
    }
</script>

</body>
</html>
