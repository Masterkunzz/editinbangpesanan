<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin EditinBang</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2, h3 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .admin-content {
            display: none;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        .order-table th, .order-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .order-table th {
            background-color: #f2f2f2;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginBox" class="login-box">
    <h2>Login Admin EditinBang</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="form-group">
        <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="prosesLogin()" style="width: 100%;">Login</button>
</div>

<div id="adminContent" class="container admin-content">
    <h2>Panel Kontrol Pesanan EditinBang</h2>
    <hr>
    
    <h3>Buat Pesanan Baru</h3>
    <form id="formPesanan" onsubmit="simpanPesanan(event)">
        <div class="form-group">
            <label>Nomor Pesanan (Contoh: EB-001)</label>
            <input type="text" id="noPesanan" required>
        </div>
        <div class="form-group">
            <label>Nama Pemesan</label>
            <input type="text" id="namaPemesan" required>
        </div>
        <div class="form-group">
            <label>Jenis Produk</label>
            <input type="text" id="jenisProduk" placeholder="Misal: Video Mentahan Minecraft / Shorts" required>
        </div>
        <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="harga" required>
        </div>
        <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="deadline" required>
        </div>
        <div class="form-group">
            <label>Editor</label>
            <input type="text" id="editor" required>
        </div>
        <div class="form-group">
            <label>Note / Catatan Tambahan</label>
            <textarea id="note" rows="3"></textarea>
        </div>
        <button type="submit">Tambah Pesanan</button>
    </form>

    <hr style="margin-top: 40px;">
    
    <h3>Daftar & Kontrol Progress Pesanan</h3>
    <table class="order-table">
        <thead>
            <tr>
                <th>No Pesanan</th>
                <th>Nama Klien</th>
                <th>Produk</th>
                <th>Editor</th>
                <th>Progress Saat Ini</th>
                <th>Ubah Kontrol Status</th>
            </tr>
        </thead>
        <tbody id="tabelPesananBody">
            </tbody>
    </table>
</div>

<script>
    // MASUKKAN KONFIGURASI FIREBASE KAMU DI SINI (SAMA SEPERTI DI INDEX.HTML)
    const firebaseConfig = {
        apiKey: "CONTOH_API_KEY",
        authDomain: "CONTOH_PROJECT.firebaseapp.com",
        databaseURL: "https://CONTOH_PROJECT-default-rtdb.firebaseio.com",
        projectId: "CONTOH_PROJECT",
        storageBucket: "CONTOH_PROJECT.appspot.com",
        messagingSenderId: "CONTOH_ID",
        appId: "CONTOH_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Fungsi Login Sederhana
    function prosesLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === "Admin" && pass === "Ahmad") {
            document.getElementById('loginBox').style.display = "none";
            document.getElementById('adminContent').style.display = "block";
            muatDaftarPesanan(); // Load data setelah login sukses
        } else {
            alert("Username atau Password salah!");
        }
    }

    // Fungsi Simpan Pesanan Baru
    function simpanPesanan(e) {
        e.preventDefault();
        
        const noPesanan = document.getElementById('noPesanan').value.trim();
        
        const dataPesanan = {
            nomor_pesanan: noPesanan,
            nama_pemesan: document.getElementById('namaPemesan').value,
            jenis_produk: document.getElementById('jenisProduk').value,
            harga: document.getElementById('harga').value,
            deadline: document.getElementById('deadline').value,
            editor: document.getElementById('editor').value,
            note: document.getElementById('note').value,
            status: "Editor sudah menerima project",
            progres: 10
        };

        database.ref('pesanan/' + noPesanan).set(dataPesanan)
        .then(() => {
            alert("Pesanan " + noPesanan + " berhasil ditambahkan!");
            document.getElementById('formPesanan').reset();
        })
        .catch((error) => {
            alert("Gagal menyimpan data: " + error.message);
        });
    }

    // Fungsi Mengubah Progress via Kontrol Dropdown Admin
    function ubahStatus(noPesanan, statusBaru) {
        let progresBaru = 10;

        if (statusBaru === "Editor sudah menerima project") progresBaru = 10;
        else if (statusBaru === "Proses editing") progresBaru = 40;
        else if (statusBaru === "Finishing") progresBaru = 80;
        else if (statusBaru === "Selesai") progresBaru = 100;

        database.ref('pesanan/' + noPesanan).update({
            status: statusBaru,
            progres: progresBaru
        });
    }

    // Ambil Semua Data Pesanan untuk Ditampilkan di Tabel Admin
    function muatDaftarPesanan() {
        database.ref('pesanan').on('value', (snapshot) => {
            const tbody = document.getElementById('tabelPesananBody');
            tbody.innerHTML = ""; // Bersihkan tabel terlebih dahulu
            
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    // Template Dropdown Pilihan Status sesuai permintaan kamu
                    const selectHTML = `
                        <select onchange="ubahStatus('${data.nomor_pesanan}', this.value)">
                            <option value="Editor sudah menerima project" ${data.status === 'Editor sudah menerima project' ? 'selected' : ''}>1. Menerima Project (10%)</option>
                            <option value="Proses editing" ${data.status === 'Proses editing' ? 'selected' : ''}>2. Proses Editing (40%)</option>
                            <option value="Finishing" ${data.status === 'Finishing' ? 'selected' : ''}>3. Finishing (80%)</option>
                            <option value="Selesai" ${data.status === 'Selesai' ? 'selected' : ''}>4. Selesai (100%)</option>
                        </select>
                    `;

                    const row = `
                        <tr>
                            <td>${data.nomor_pesanan}</td>
                            <td>${data.nama_pemesan}</td>
                            <td>${data.jenis_produk}</td>
                            <td>${data.editor}</td>
                            <td><strong>${data.status} (${data.progres}%)</strong></td>
                            <td>${selectHTML}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Belum ada data pesanan.</td></tr>";
            }
        });
    }
</script>

</body>
</html>
