<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Preview Video — EditinBang</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3D00;--black:#0a0a0a;--card:#111111;
  --border:#1f1f1f;--white:#F5F5F5;--muted:#666;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--black);
  color:var(--white);
  min-height:100vh;
  display:flex;flex-direction:column;
  user-select:none;
  -webkit-user-select:none;
}

/* ── NAV ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;
  border-bottom:1px solid var(--border);
  background:rgba(10,10,10,0.95);
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50;
}
.nav-logo img{height:28px;width:auto;opacity:0.9;}
.nav-badge{
  font-family:'Inter',sans-serif;
  font-size:11px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  background:rgba(255,61,0,0.12);
  color:var(--red);
  border:1px solid rgba(255,61,0,0.25);
  padding:5px 12px;border-radius:20px;
}
.nav-timer{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;letter-spacing:2px;
  color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.nav-timer span{color:var(--white);}
.nav-timer.urgent span{color:var(--red);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── MAIN ── */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px;max-width:960px;width:100%;margin:0 auto;}

.video-meta{width:100%;margin-bottom:20px;}
.video-title-display{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,4vw,42px);
  line-height:1;
  color:var(--white);
  margin-bottom:8px;
}
.video-meta-row{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.meta-item{
  font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:5px;
}
.meta-item svg{width:13px;height:13px;fill:var(--muted);}
.meta-divider{width:3px;height:3px;background:var(--border);border-radius:50%;}

/* ── PLAYER WRAPPER ── */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}

/* Iframe player */
.player-wrap iframe{
  width:100%;height:100%;
  border:none;
  display:block;
}

/* Overlay transparan — block klik kanan & interaksi langsung ke iframe */
.player-overlay{
  position:absolute;inset:0;
  z-index:10;
  background:transparent;
  cursor:default;
}

/* Watermark pojok kanan bawah */
.watermark{
  position:absolute;
  bottom:14px;right:14px;
  z-index:20;
  display:flex;align-items:center;gap:7px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(6px);
  padding:6px 12px;
  border-radius:20px;
  pointer-events:none;
}
.watermark img{height:16px;opacity:0.8;}
.watermark span{
  font-size:10px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,0.6);
}

/* ── NOTE BOX ── */
.note-box{
  width:100%;
  margin-top:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-left:3px solid var(--red);
  border-radius:8px;
  padding:16px 20px;
  display:flex;gap:14px;align-items:flex-start;
}
.note-icon{flex-shrink:0;margin-top:1px;}
.note-icon svg{width:16px;height:16px;fill:var(--red);}
.note-text{font-size:13px;line-height:1.6;color:#888;}
.note-text strong{color:var(--white);}

/* ── EXPIRY BAR ── */
.expiry-bar-wrap{
  width:100%;margin-top:16px;
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:14px 18px;
}
.expiry-label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);margin-bottom:8px;
}
.expiry-label strong{color:var(--white);}
.expiry-track{background:var(--border);border-radius:10px;height:4px;overflow:hidden;}
.expiry-fill{height:100%;background:var(--red);border-radius:10px;transition:width 1s linear;}

/* ── EXPIRED / LOADING screen ── */
.full-screen{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
  gap:16px;
}
.fs-icon{
  width:72px;height:72px;
  border-radius:50%;
  background:rgba(255,61,0,0.08);
  border:1px solid rgba(255,61,0,0.2);
  display:flex;align-items:center;justify-content:center;
}
.fs-icon svg{width:32px;height:32px;fill:var(--red);}
.fs-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;}
.fs-sub{font-size:14px;color:var(--muted);max-width:380px;line-height:1.7;}
.fs-sub a{color:var(--red);text-decoration:none;}
.fs-sub a:hover{text-decoration:underline;}

/* Footer */
footer{
  padding:18px 32px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:var(--muted);letter-spacing:0.5px;
}
footer img{height:14px;opacity:0.4;}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--white);}
</style>
</head>

document.addEventListener('contextmenu', e => e.preventDefault());

// Block keyboard shortcut download / save
document.addEventListener('keydown', e => {
  const blocked = (
    (e.ctrlKey || e.metaKey) && ['s','S','u','U','p','P'].includes(e.key)
  ) || e.key === 'F12';
  if (blocked) e.preventDefault();
});

async function init() {
  const params  = new URLSearchParams(window.location.search);
  const previewId = params.get('id');

  const app = document.getElementById('app');

  if (!previewId) { showExpired(app, 'Link tidak valid.'); return; }

  // Fetch data dari Firebase
  try {
    const res  = await fetch(`${DB}/previews/${previewId}.json`);
    const data = await res.json();

    if (!data) { showExpired(app, 'Preview tidak ditemukan.'); return; }

    // Cek expiry
    const now       = Date.now();
    const expiresAt = data.expires_at;

    if (now > expiresAt) {
      showExpired(app, 'Link preview ini sudah kedaluwarsa.', data.klien);
      return;
    }

    showPlayer(app, data, expiresAt);
    startTimer(expiresAt);
    startExpiryBar(expiresAt, data.created_at);

  } catch(e) {
    showExpired(app, 'Gagal memuat preview. Coba lagi.');
  }
}

function getEmbedUrl(url) {
  if (!url) return null;

  // Streamable: https://streamable.com/xxxxx
  const streamable = url.match(/streamable\.com\/([a-zA-Z0-9]+)/);
  if (streamable) return `https://streamable.com/e/${streamable[1]}?autoplay=0`;

  // YouTube: youtu.be/ID atau youtube.com/watch?v=ID atau youtube.com/shorts/ID
  const yt1 = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
  const yt2 = url.match(/youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)/);
  const yt3 = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]+)/);
  const ytId = (yt1||yt2||yt3)?.[1];
  if (ytId) return `https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1`;

  // Google Drive
  const gd1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  const gd2 = url.match(/id=([a-zA-Z0-9_-]+)/);
  const gdId = (gd1||gd2)?.[1];
  if (gdId) return `https://drive.google.com/file/d/${gdId}/preview`;

  return null;
}

function showPlayer(app, data, expiresAt) {

    day:'numeric', month:'long', year:'numeric',
    hour:'2-digit', minute:'2-digit'

            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>

      <div class="player-wrap" id="player-wrap">

          Video ini hanya bisa ditonton, tidak untuk disebarkan.
          Link akan otomatis nonaktif setelah 24 jam.
          Ada revisi? Hubungi kami via WhatsApp.

      </div>

      <div class="expiry-bar-wrap" id="expiry-bar-wrap">

          <div class="expiry-fill" id="expiry-fill" style="width:100%"></div>

    </main>`;

function showExpired(app, msg, klien) {
  app.innerHTML = `
    <div class="full-screen">
      <div class="fs-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      </div>
      <div class="fs-title">Link Kedaluwarsa</div>
      <p class="fs-sub">${msg}${klien ? ` Hai <strong>${klien}</strong>,` : ''} Hubungi kami untuk meminta link preview baru.<br>
        <a href="https://wa.me/6283834713950" target="_blank">Chat via WhatsApp &rarr;</a>
      </p>
    </div>`;
}

let timerInterval, barInterval;

function startTimer(expiresAt) {
  const el = document.getElementById('timer-text');
  const nav = document.getElementById('nav-timer');

  function update() {
    const diff = expiresAt - Date.now();
    if (diff <= 0) {
      clearInterval(timerInterval);
      location.reload();
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (diff < 3600000) nav.classList.add('urgent');
  }
  update();
  timerInterval = setInterval(update, 1000);
}

function startExpiryBar(expiresAt, createdAt) {
  const total = expiresAt - createdAt;
  const fill  = document.getElementById('expiry-fill');
  const countdown = document.getElementById('expiry-countdown');

  function update() {
    const remaining = expiresAt - Date.now();
    if (remaining <= 0) { fill.style.width = '0%'; return; }
    const pct = Math.max(0, (remaining / total) * 100);
    fill.style.width = pct + '%';
    // Warna berubah saat < 25%
    fill.style.background = pct < 25 ? '#FF3D00' : pct < 50 ? '#FFB300' : '#10b981';

    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    countdown.textContent = h > 0 ? `${h} jam ${m} menit` : `${m} menit`;
  }
  update();
  barInterval = setInterval(update, 10000);
}

init();
</script>
